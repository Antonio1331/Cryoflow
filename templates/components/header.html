<header class="nasa-header">
    <div class="header-left">
        <div class="nasa-logo-box">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#0B3D91"/>
                <path d="M4 12c4-3 12-3 16 0M6 8c3 6 9 8 12 8" stroke="#FC3D21" stroke-width="1.5"/>
                <circle cx="8" cy="9" r="1" fill="#FFF"/>
            </svg>
        </div>
        <div class="title-block">
            <h1 class="system-name">CryoFlow</h1>
            <span class="system-sub">NASA MODIS Hydro-Glaciology Platform</span>
        </div>
    </div>

    <div class="header-center">
        <div class="telemetry-badge">
            <span class="status-pulse"></span>
            <span>MODIS TERRA/AQUA: ONLINE</span>
        </div>
    </div>

    <div class="header-right">
        <select class="nasa-select" id="lang-switcher">
            <option value="ru">Русский</option>
            <option value="uz">O'zbek</option>
            <option value="en">English</option>
        </select>
    </div>
</header>
